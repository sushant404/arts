<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photography — Ansui Ryusho</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;1,300;1,400&family=Inconsolata:wght@300;400&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

.arts {
  font-family: 'Crimson Pro', serif;
  color: #1a1a1a;
  max-width: 820px;
  margin: 0 auto;
  padding: 0 2rem 4rem;
  background: #ffffff;
  min-height: 100vh;
}

/* NAV */
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 2rem 0 1.5rem;
  border-bottom: 0.5px solid rgba(0,0,0,0.1);
  margin-bottom: 0;
}
.pen-name {
  font-family: 'EB Garamond', serif;
  font-size: 18px;
  font-style: italic;
  letter-spacing: 0.02em;
}
.pen-sub {
  font-family: 'Inconsolata', monospace;
  font-size: 10px;
  letter-spacing: 0.14em;
  color: #888;
  margin-top: 2px;
}
.nav-top {
  display: flex;
  gap: 20px;
  align-items: center;
}
.nav-top a {
  font-family: 'Inconsolata', monospace;
  font-size: 11px;
  letter-spacing: 0.1em;
  color: #666;
  text-decoration: none;
}
.nav-top a:hover { color: #1a1a1a; }

/* HERO */
.hero {
  padding: 4rem 0 3rem;
  border-bottom: 0.5px solid rgba(0,0,0,0.08);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4rem;
  align-items: start;
}
.hero-left {}
.hero-eyebrow {
  font-family: 'Inconsolata', monospace;
  font-size: 10px;
  letter-spacing: 0.16em;
  color: #999;
  margin-bottom: 1.25rem;
}
.hero-declaration {
  font-family: 'EB Garamond', serif;
  font-size: 42px;
  font-weight: 400;
  line-height: 1.2;
  font-style: italic;
  margin-bottom: 1.5rem;
}
.hero-media-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.media-pill {
  font-family: 'Inconsolata', monospace;
  font-size: 10px;
  letter-spacing: 0.1em;
  padding: 4px 12px;
  border: 0.5px solid rgba(0,0,0,0.18);
  border-radius: 20px;
  color: #666;
}

/* FEATURED POEM */
.featured-poem {
  padding: 2rem;
  border: 0.5px solid rgba(0,0,0,0.1);
  border-radius: 8px;
  position: relative;
}
.featured-label {
  font-family: 'Inconsolata', monospace;
  font-size: 10px;
  letter-spacing: 0.14em;
  color: #999;
  margin-bottom: 1rem;
}
.poem-excerpt {
  font-family: 'EB Garamond', serif;
  font-size: 18px;
  font-style: italic;
  line-height: 1.9;
  color: #555;
}
.poem-excerpt strong {
  font-style: normal;
  font-weight: 400;
  color: #1a1a1a;
  display: block;
  margin-top: 0.75rem;
  font-size: 14px;
}
.read-link {
  font-family: 'Inconsolata', monospace;
  font-size: 11px;
  letter-spacing: 0.08em;
  color: #999;
  text-decoration: none;
  display: block;
  margin-top: 1rem;
}
.read-link:hover { color: #1a1a1a; }

/* SECTION DIVIDER */
.divider {
  border: none;
  border-top: 0.5px solid rgba(0,0,0,0.08);
  margin: 3rem 0;
}

/* SECTION HEADER */
.pillars-header {
  font-family: 'Inconsolata', monospace;
  font-size: 10px;
  letter-spacing: 0.16em;
  color: #999;
  margin-bottom: 2rem;
}

/* THEMATIC PILLARS */
.pillar-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 1px;
  background: rgba(0,0,0,0.08);
  border: 0.5px solid rgba(0,0,0,0.1);
  border-radius: 8px;
  overflow: hidden;
  margin-bottom: 2rem;
}
.pillar {
  background: #ffffff;
  padding: 1.75rem 1.5rem;
}
.pillar-glyph {
  font-family: 'EB Garamond', serif;
  font-size: 28px;
  font-style: italic;
  color: #bbb;
  margin-bottom: 0.75rem;
}
.pillar-name {
  font-family: 'EB Garamond', serif;
  font-size: 20px;
  font-weight: 400;
  margin-bottom: 0.5rem;
}
.pillar-desc {
  font-size: 14px;
  line-height: 1.7;
  color: #666;
  margin-bottom: 1rem;
}
.pillar-poems {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.pillar-poem-link {
  font-family: 'Inconsolata', monospace;
  font-size: 11px;
  color: #aaa;
  text-decoration: none;
  letter-spacing: 0.04em;
  border-left: 1px solid rgba(0,0,0,0.1);
  padding-left: 8px;
}
.pillar-poem-link:hover {
  color: #1a1a1a;
  border-left-color: rgba(0,0,0,0.3);
}

/* ANNOTATION */
.annotation {
  background: #f9f7f5;
  border-left: 2px solid #E24B4A;
  border-radius: 0 6px 6px 0;
  padding: 10px 14px;
  font-family: 'Inconsolata', monospace;
  font-size: 12px;
  color: #666;
  margin-top: 8px;
  line-height: 1.5;
}
.annotation-label {
  font-weight: 400;
  font-size: 10px;
  letter-spacing: 0.06em;
  color: #A32D2D;
  margin-bottom: 3px;
}

/* MUSIC SECTION */
.music-section {
  padding: 3rem 0;
  border-bottom: 0.5px solid rgba(0,0,0,0.08);
}
.music-header {
  font-family: 'Inconsolata', monospace;
  font-size: 10px;
  letter-spacing: 0.16em;
  color: #999;
  margin-bottom: 2rem;
}
.music-body {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 3rem;
  align-items: center;
}
.music-title {
  font-family: 'EB Garamond', serif;
  font-size: 34px;
  font-style: italic;
  font-weight: 400;
  line-height: 1.15;
  margin-bottom: 0.75rem;
}
.music-desc {
  font-size: 16px;
  line-height: 1.8;
  color: #666;
  margin-bottom: 1.5rem;
}
.music-links {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.music-link {
  font-family: 'Inconsolata', monospace;
  font-size: 11px;
  letter-spacing: 0.06em;
  color: #666;
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 6px;
}
.music-link:hover { color: #1a1a1a; }
.music-aside {
  padding: 1.5rem;
  border: 0.5px solid rgba(0,0,0,0.1);
  border-radius: 8px;
}
.aside-season {
  font-family: 'Inconsolata', monospace;
  font-size: 10px;
  letter-spacing: 0.12em;
  color: #999;
  margin-bottom: 0.5rem;
}
.aside-ep {
  font-family: 'EB Garamond', serif;
  font-size: 16px;
  font-style: italic;
  margin-bottom: 0.5rem;
}
.aside-tracks {
  font-size: 13px;
  color: #666;
  line-height: 1.6;
}

/* ALL POEMS */
.all-poems {
  padding: 3rem 0;
  border-bottom: 0.5px solid rgba(0,0,0,0.08);
}
.poem-index {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
  border: 0.5px solid rgba(0,0,0,0.1);
  border-radius: 8px;
  overflow: hidden;
}
.poem-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 14px 16px;
  border-bottom: 0.5px solid rgba(0,0,0,0.07);
  background: #ffffff;
  cursor: pointer;
}
.poem-row:last-child { border-bottom: none; }
.poem-row:hover { background: #f9f7f5; }
.poem-row-title {
  font-family: 'EB Garamond', serif;
  font-size: 16px;
  font-style: italic;
}
.poem-row-tag {
  font-family: 'Inconsolata', monospace;
  font-size: 10px;
  color: #aaa;
  letter-spacing: 0.08em;
}

/* ABOUT STRIP */
.about-strip {
  padding: 3rem 0;
  border-bottom: 0.5px solid rgba(0,0,0,0.08);
  display: grid;
  grid-template-columns: 1fr 2fr;
  gap: 3rem;
  align-items: start;
}
.about-label {
  font-family: 'Inconsolata', monospace;
  font-size: 10px;
  letter-spacing: 0.16em;
  color: #999;
  padding-top: 4px;
}
.about-body-text {
  font-size: 17px;
  line-height: 1.85;
  color: #555;
}
.about-body-text em {
  color: #1a1a1a;
  font-style: italic;
}

/* FOOTER */
.footer {
  padding-top: 2rem;
  display: flex;
  justify-content: space-between;
  font-family: 'Inconsolata', monospace;
  font-size: 10px;
  color: #aaa;
  letter-spacing: 0.06em;
}

@media (max-width: 620px) {
  .hero, .pillar-grid, .music-body, .poem-index, .about-strip {
    grid-template-columns: 1fr;
  }
  .hero-declaration { font-size: 30px; }
}

a.pen-name {
  color: inherit;
  text-decoration: none;
}
a.pen-name:hover { color: #1a1a1a; }

.poem-block {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.poem-block:last-child > .poem-row {
  border-bottom: none;
}
.poem-full {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.55s ease, padding 0.45s ease;
  padding: 0 16px;
  background: #f9f7f5;
  font-family: 'EB Garamond', serif;
  font-size: 15px;
  line-height: 1.85;
  color: #444;
  border-top: 0.5px solid rgba(0,0,0,0.06);
}
.poem-block.is-open .poem-full {
  max-height: 4800px;
  padding-top: 1rem;
  padding-bottom: 1.25rem;
}
.page-placeholder {
  padding: 5rem 0 4rem;
  text-align: center;
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-size: 22px;
  color: #666;
  letter-spacing: 0.02em;
}
.poem-pending {
  font-family: 'EB Garamond', serif;
  font-style: italic;
  text-align: center;
  color: #666;
  padding: 0.5rem 0 0.25rem;
}
.about-body-text p + p {
  margin-top: 1.25rem;
}
.poem-full p + p {
  margin-top: 0.75rem;
}

/* PHOTOGRAPHY GALLERY */
.photo-gallery {
  padding-top: 3rem;
}
.photo-section {
  margin-bottom: 0;
}
.photo-section-label {
  font-family: 'Inconsolata', monospace;
  font-size: 10px;
  letter-spacing: 0.16em;
  color: #999;
  margin-bottom: 0.5rem;
}
.photo-section-desc {
  font-family: 'EB Garamond', serif;
  font-size: 17px;
  font-style: italic;
  line-height: 1.65;
  color: #666;
  margin-bottom: 1.25rem;
}
.photo-strip {
  display: flex;
  flex-direction: row;
  flex-wrap: nowrap;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 12px;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.photo-strip::-webkit-scrollbar {
  display: none;
}
.photo-strip img {
  height: 420px;
  width: auto;
  object-fit: cover;
  cursor: pointer;
  flex-shrink: 0;
  transition: opacity 0.3s ease;
}
.photo-strip img:hover {
  opacity: 0.85;
}
.photo-section-divider {
  border: none;
  border-top: 0.5px solid rgba(0,0,0,0.08);
  margin: 3rem 0;
}
.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.92);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 10000;
  cursor: pointer;
  padding: 2rem;
  box-sizing: border-box;
}
.lightbox.is-open {
  display: flex;
}
.lightbox img {
  max-height: 90vh;
  max-width: 90vw;
  object-fit: contain;
  pointer-events: none;
}
</style>
</head>
<body>

<div class="arts">

  <nav class="topbar">
    <div>
      <a href="index.html" class="pen-name">Ansui Ryusho</a>
      <div class="pen-sub">PEN NAME OF SUSHANT SHRESTHA</div>
    </div>
    <div class="nav-top">
      <a href="poetry.html">Poetry</a>
      <a href="music.html">Music</a>
      <a href="photography.html">Photography</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>

  <div class="photo-gallery">

    <section class="photo-section" aria-labelledby="photo-label-self">
      <div class="photo-section-label" id="photo-label-self">SELF</div>
      <p class="photo-section-desc">The interior witness.</p>
      <div class="photo-strip">
        <img src="assets/images/self/self1.png" alt="">
        <img src="assets/images/self/self2.png" alt="">
        <img src="assets/images/self/self3.png" alt="">
        <img src="assets/images/self/self4.png" alt="">
        <img src="assets/images/self/self5.png" alt="">
        <img src="assets/images/self/self6.png" alt="">
      </div>
      <hr class="photo-section-divider">
    </section>

    <section class="photo-section" aria-labelledby="photo-label-feminine">
      <div class="photo-section-label" id="photo-label-feminine">FEMININE</div>
      <p class="photo-section-desc">The beloved as portal.</p>
      <div class="photo-strip">
        <img src="assets/images/feminine/fem1.png" alt="">
        <img src="assets/images/feminine/fem2.png" alt="">
        <img src="assets/images/feminine/fem3.jpg" alt="">
        <img src="assets/images/feminine/fem4.png" alt="">
        <img src="assets/images/feminine/fem5.png" alt="">
      </div>
      <hr class="photo-section-divider">
    </section>

    <section class="photo-section" aria-labelledby="photo-label-nature">
      <div class="photo-section-label" id="photo-label-nature">NATURE</div>
      <p class="photo-section-desc">The world as mirror and teacher.</p>
      <div class="photo-strip">
        <img src="assets/images/nature/nature1.JPG" alt="">
        <img src="assets/images/nature/nature2.JPG" alt="">
        <img src="assets/images/nature/nature3.JPG" alt="">
        <img src="assets/images/nature/nature4.JPG" alt="">
        <img src="assets/images/nature/nature5.JPG" alt="">
        <img src="assets/images/nature/nature6.jpg" alt="">
        <img src="assets/images/nature/nature7.jpg" alt="">
        <img src="assets/images/nature/nature8.jpg" alt="">
        <img src="assets/images/nature/nature9.jpg" alt="">
        <img src="assets/images/nature/nature10.JPG" alt="">
      </div>
    </section>

  </div>

  <div id="lightbox" class="lightbox" aria-hidden="true" role="dialog" aria-label="Image">
    <img src="" alt="">
  </div>

  <script>
  (function () {
    var lb = document.getElementById('lightbox');
    if (!lb) return;
    var lbImg = lb.querySelector('img');
    function openLightbox(src) {
      lbImg.src = src;
      lbImg.alt = '';
      lb.classList.add('is-open');
      lb.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }
    function closeLightbox() {
      lb.classList.remove('is-open');
      lb.setAttribute('aria-hidden', 'true');
      lbImg.removeAttribute('src');
      document.body.style.overflow = '';
    }
    lb.addEventListener('click', closeLightbox);

    var stripStates = [];
    document.querySelectorAll('.photo-strip').forEach(function (strip) {
      var originals = Array.prototype.slice.call(strip.querySelectorAll('img'));
      originals.forEach(function (img) {
        strip.appendChild(img.cloneNode(true));
      });
      var state = { strip: strip, paused: false };
      strip.addEventListener('mouseenter', function () {
        state.paused = true;
      });
      strip.addEventListener('mouseleave', function () {
        state.paused = false;
      });
      stripStates.push(state);
    });

    document.querySelectorAll('.photo-strip img').forEach(function (img) {
      img.addEventListener('click', function () {
        openLightbox(img.currentSrc || img.src);
      });
    });

    var speedPxPerSec = 40;
    var lastT = performance.now();
    function tick(now) {
      var dt = (now - lastT) / 1000;
      if (dt > 0.1) dt = 0.1;
      lastT = now;
      stripStates.forEach(function (state) {
        if (state.paused) return;
        var strip = state.strip;
        var loopW = strip.scrollWidth / 2;
        if (loopW < 1) return;
        strip.scrollLeft += speedPxPerSec * dt;
        while (strip.scrollLeft >= loopW - 0.5) {
          strip.scrollLeft -= loopW;
        }
      });
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  })();
  </script>

  <footer class="footer">
    <span>© 2026 Ansui Ryusho · Pacific Northwest · Bay Area</span>
  </footer>
</div>
